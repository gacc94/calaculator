name: Primer Workflow de Aprendizaje

on:
    push:
        branches:
            - main
jobs:
    environment-inspection:
        name: '🚀 Compilación y Empaquetado de Frontend'

        runs-on: ubuntu-latest

        steps:
            - name: 1. Imprimir saludo en el log
              run: echo "¡Hola mundo desde GitHub Actions!"

            - name: 2. Inspeccionar la máquina virtual
              run: |
                  echo "Usuario actual: $(whoami)"
                  echo "Sistema operativo: $(uname -a)"
                  echo "Directorio de trabajo: $(pwd)"

            # Step 3: Provocar un fallo intencional
            - name: 3. Simulación de fallo en pruebas
              run: |
                  echo "Ejecutando suite de pruebas críticas..."
                  # Descomenta la línea de abajo para ver el workflow ponerse en ROJO:
                  # exit 1

            - name: 4. Comando tolerante a fallos
              run: |
                  # Si un comando grep no encuentra nada, devuelve exit code 1.
                  # Con '|| true' forzamos que el exit code final sea 0:
                  grep "palabra_inexistente" README.md || true
                  echo "El pipeline continuó porque controlamos el exit code."

            - name: 5. Inspección con Python
              shell: python
              run: |
                  import sys
                  print(f"Hola desde Python {sys.version_info.major}.{sys.version_info.minor}")
